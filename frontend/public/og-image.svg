<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 90)">
    <rect width="72" height="72" rx="18" fill="#ffffff" />
    <path d="M36 56s14-7 14-17.5V26l-14-5.25L22 26v12.5C22 49 36 56 36 56z" fill="none" stroke="#09090b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m30 37.5 4.5 4.5 8-8" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Heading -->
  <text x="195" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">Redressal</text>
  <text x="430" y="142" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#a1a1aa" letter-spacing="3">PORTAL</text>

  <!-- Pill Tag -->
  <g transform="translate(100, 195)">
    <rect width="210" height="34" rx="17" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#d4d4d8">Parul University</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#f4f4f5" letter-spacing="-1.5">
    Institutional Student Grievance
  </text>
  <text x="100" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#a1a1aa" letter-spacing="-1.5">
    &amp; Review System
  </text>

  <!-- Feature Description -->
  <text x="100" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#71717a">
    Accountable, role-based complaint routing across Academics, Facilities, Mess &amp; Safety.
  </text>

  <!-- Cards / Badges at bottom -->
  <g transform="translate(100, 480)">
    <!-- Card 1 -->
    <rect width="280" height="64" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="30" cy="32" r="5" fill="#e4e4e7" />
    <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" letter-spacing="1">ROLE ROUTING</text>
    <text x="50" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">HOD, Proctor, Warden</text>

    <!-- Card 2 -->
    <rect x="305" width="280" height="64" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="335" cy="32" r="5" fill="#f59e0b" />
    <text x="355" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" letter-spacing="1">STATUS WORKFLOW</text>
    <text x="355" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">Live Tracking &amp; Notes</text>

    <!-- Card 3 -->
    <rect x="610" width="280" height="64" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="640" cy="32" r="5" fill="#10b981" />
    <text x="660" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" letter-spacing="1">DATA RESOLUTION</text>
    <text x="660" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#f4f4f5">Real-time Analytics</text>
  </g>
</svg>
